name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Scaffold and Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Android Files
        run: |
          flutter create . --platforms=android --org=com.macro --project-name=macro_automator --overwrite

      - name: Configure Android Native Files via Python
        run: |
          python3 - << 'EOF'
          import os

          # 1. Update AndroidManifest.xml
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
            content = f.read()

          pip_flags = 'android:supportsPictureInPicture="true"\n            android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation"\n'
          if 'supportsPictureInPicture' not in content:
            content = content.replace('<activity', '<activity\n            ' + pip_flags)

          service_entry = """
                  <service
                      android:name=".MacroAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice.AccessibilityService"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>"""
          if 'MacroAccessibilityService' not in content:
            content = content.replace('</application>', service_entry)

          with open(manifest_path, "w") as f:
            f.write(content)

          # 2. Create accessibility XML
          os.makedirs("android/app/src/main/res/xml", exist_ok=True)
          xml_content = """<?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />"""
          with open("android/app/src/main/res/xml/accessibility_service_config.xml", "w") as f:
            f.write(xml_content.strip())

          # 3. Write Kotlin files
          kotlin_dir = "android/app/src/main/kotlin/com/macro/macro_automator"
          os.makedirs(kotlin_dir, exist_ok=True)

          main_activity = """package com.macro.macro_automator

          import android.app.PictureInPictureParams
          import android.content.Intent
          import android.os.Build
          import android.provider.Settings
          import android.util.Rational
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.macro.automator/actions"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "isAccessibilityEnabled" -> {
                              result.success(MacroAccessibilityService.instance != null)
                          }
                          "openAccessibilitySettings" -> {
                              startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                              result.success(true)
                          }
                          "enterPip" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  val params = PictureInPictureParams.Builder()
                                      .setAspectRatio(Rational(1, 1))
                                      .build()
                                  enterPictureInPictureMode(params)
                                  result.success(true)
                              } else {
                                  result.error("PIP_UNSUPPORTED", "Android O+ required for PiP", null)
                              }
                          }
                          "dispatchTap" -> {
                              val x = call.argument<Double>("x")?.toFloat() ?: 0f
                              val y = call.argument<Double>("y")?.toFloat() ?: 0f
                              MacroAccessibilityService.instance?.dispatchTap(x, y)
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }"""
          with open(os.path.join(kotlin_dir, "MainActivity.kt"), "w") as f:
            f.write(main_activity)

          service_code = """package com.macro.macro_automator

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent

          class MacroAccessibilityService : AccessibilityService() {
              companion object {
                  var instance: MacroAccessibilityService? = null
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun dispatchTap(x: Float, y: Float) {
                  val path = Path().apply {
                      moveTo(x, y)
                  }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 100))
                      .build()
                  dispatchGesture(gesture, null, null)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  instance = null
              }
          }"""
          with open(os.path.join(kotlin_dir, "MacroAccessibilityService.kt"), "w") as f:
            f.write(service_code)
          print("Native configuration successfully injected!")
          EOF

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          
