name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Game Macro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Clean Android Project
        run: |
          rm -rf android
          mkdir -p /tmp/user_backup
          cp -r lib /tmp/user_backup/
          cp pubspec.yaml /tmp/user_backup/
          flutter create . --platforms=android --org=com.macro --project-name=macro_automator --overwrite
          rm -rf lib pubspec.yaml
          cp -r /tmp/user_backup/lib ./
          cp /tmp/user_backup/pubspec.yaml ./

      - name: Inject Touch Recording & Anti-Ban Architecture
        run: |
          python3 - << 'EOF'
          import os

          # 1. AndroidManifest.xml
          manifest_content = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:label="macro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MacroAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice.AccessibilityService"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <service
                      android:name=".FloatingMacroService"
                      android:exported="false" />

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>'''

          with open("android/app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(manifest_content.strip())

          # 2. accessibility_service_config.xml
          os.makedirs("android/app/src/main/res/xml", exist_ok=True)
          acc_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />'''

          with open("android/app/src/main/res/xml/accessibility_service_config.xml", "w", encoding="utf-8") as f:
              f.write(acc_xml.strip())

          # 3. Kotlin Classes
          kdir = "android/app/src/main/kotlin/com/macro/macro_automator"
          os.makedirs(kdir, exist_ok=True)

          # MainActivity.kt
          main_kt = '''package com.macro.macro_automator

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.macro.automator/actions"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "isAccessibilityEnabled" -> {
                              result.success(MacroAccessibilityService.instance != null)
                          }
                          "isOverlayEnabled" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  result.success(Settings.canDrawOverlays(this))
                              } else {
                                  result.success(true)
                              }
                          }
                          "openAccessibilitySettings" -> {
                              startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                              result.success(true)
                          }
                          "openOverlaySettings" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  val intent = Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse("package:$packageName")
                                  )
                                  startActivity(intent)
                              }
                              result.success(true)
                          }
                          "startFloatingService" -> {
                              val loops = call.argument<Int>("loops") ?: 0
                              val antiBan = call.argument<Boolean>("antiBan") ?: true
                              val intent = Intent(this, FloatingMacroService::class.java).apply {
                                  putExtra("loops", loops)
                                  putExtra("antiBan", antiBan)
                              }
                              startService(intent)
                              moveTaskToBack(true)
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }'''

          with open(os.path.join(kdir, "MainActivity.kt"), "w", encoding="utf-8") as f:
              f.write(main_kt.strip())

          # MacroAccessibilityService.kt
          acc_kt = '''package com.macro.macro_automator

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.os.Build
          import android.view.accessibility.AccessibilityEvent

          class MacroAccessibilityService : AccessibilityService() {
              companion object {
                  var instance: MacroAccessibilityService? = null
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun dispatchTap(x: Float, y: Float, durationMs: Long = 60L) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      val path = Path().apply { moveTo(x, y) }
                      val gesture = GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(path, 0, durationMs.coerceAtLeast(30L)))
                          .build()
                      dispatchGesture(gesture, null, null)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  instance = null
              }
          }'''

          with open(os.path.join(kdir, "MacroAccessibilityService.kt"), "w", encoding="utf-8") as f:
              f.write(acc_kt.strip())

          # FloatingMacroService.kt
          float_kt = '''package com.macro.macro_automator

          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.random.Random

          data class MacroStep(
              val x: Float,
              val y: Float,
              val delayMillis: Long,
              val durationMillis: Long
          )

          class FloatingMacroService : Service() {
              private lateinit var windowManager: WindowManager
              private var floatingControlView: LinearLayout? = null
              private var recordOverlayView: View? = null
              private lateinit var tvStatus: TextView
              private lateinit var btnRec: Button
              private lateinit var btnPlay: Button

              private val recordedSteps = mutableListOf<MacroStep>()
              private var isRecording = false
              private var isPlaying = false
              private var lastActionTime = 0L
              private var touchDownTime = 0L

              private var maxLoops = 0
              private var antiBanEnabled = true
              private var currentLoop = 0
              private val handler = Handler(Looper.getMainLooper())

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  maxLoops = intent?.getIntExtra("loops", 0) ?: 0
                  antiBanEnabled = intent?.getBooleanExtra("antiBan", true) ?: true
                  return START_NOT_STICKY
              }

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  createControlBar()
              }

              private fun getOverlayType(): Int {
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  else
                      WindowManager.LayoutParams.TYPE_PHONE
              }

              private fun createControlBar() {
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      getOverlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 40
                      y = 200
                  }

                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#EE1E1E1E"))
                      setPadding(14, 14, 14, 14)
                  }

                  tvStatus = TextView(this).apply {
                      text = "Idle"
                      setTextColor(Color.parseColor("#FFCC00"))
                      textSize = 12f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 8)
                  }
                  bar.addView(tvStatus)

                  btnRec = Button(this).apply {
                      text = "● REC"
                      setBackgroundColor(Color.parseColor("#B71C1C"))
                      setTextColor(Color.WHITE)
                      setOnClickListener { toggleRecord() }
                  }
                  bar.addView(btnRec)

                  btnPlay = Button(this).apply {
                      text = "▶ PLAY"
                      setBackgroundColor(Color.parseColor("#1B5E20"))
                      setTextColor(Color.WHITE)
                      setOnClickListener { togglePlay() }
                  }
                  bar.addView(btnPlay)

                  val btnExit = Button(this).apply {
                      text = "✕ EXIT"
                      setBackgroundColor(Color.parseColor("#424242"))
                      setTextColor(Color.WHITE)
                      setOnClickListener { stopSelf() }
                  }
                  bar.addView(btnExit)

                  bar.setOnTouchListener(object : View.OnTouchListener {
                      private var initialX = 0
                      private var initialY = 0
                      private var initialTouchX = 0f
                      private var initialTouchY = 0f

                      override fun onTouch(v: View?, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = params.x
                                  initialY = params.y
                                  initialTouchX = event.rawX
                                  initialTouchY = event.rawY
                                  return false
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = initialX + (event.rawX - initialTouchX).toInt()
                                  params.y = initialY + (event.rawY - initialTouchY).toInt()
                                  windowManager.updateViewLayout(bar, params)
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  floatingControlView = bar
                  windowManager.addView(bar, params)
              }

              private fun toggleRecord() {
                  if (isPlaying) return

                  if (!isRecording) {
                      isRecording = true
                      recordedSteps.clear()
                      lastActionTime = System.currentTimeMillis()
                      btnRec.text = "■ STOP"
                      btnRec.setBackgroundColor(Color.parseColor("#E65100"))
                      tvStatus.text = "Recording: 0"
                      attachTouchCaptureOverlay()
                  } else {
                      isRecording = false
                      detachTouchCaptureOverlay()
                      btnRec.text = "● REC"
                      btnRec.setBackgroundColor(Color.parseColor("#B71C1C"))
                      tvStatus.text = "Saved: ${recordedSteps.size} steps"
                  }
              }

              private fun attachTouchCaptureOverlay() {
                  if (recordOverlayView != null) return

                  val overlayParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      getOverlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )

                  val captureView = View(this).apply {
                      setBackgroundColor(Color.TRANSPARENT)
                      setOnTouchListener { _, event ->
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  touchDownTime = System.currentTimeMillis()
                                  true
                              }
                              MotionEvent.ACTION_UP -> {
                                  val now = System.currentTimeMillis()
                                  val holdDuration = (now - touchDownTime).coerceIn(40L, 250L)
                                  val delay = if (recordedSteps.isEmpty()) 0L else (now - lastActionTime)
                                  lastActionTime = now

                                  val x = event.rawX
                                  val y = event.rawY

                                  recordedSteps.add(MacroStep(x, y, delay, holdDuration))
                                  tvStatus.text = "Recording: ${recordedSteps.size}"

                                  MacroAccessibilityService.instance?.dispatchTap(x, y, holdDuration)
                                  true
                              }
                              else -> false
                          }
                      }
                  }

                  recordOverlayView = captureView
                  windowManager.addView(captureView, overlayParams)

                  floatingControlView?.let {
                      val layoutParams = it.layoutParams as WindowManager.LayoutParams
                      windowManager.removeView(it)
                      windowManager.addView(it, layoutParams)
                  }
              }

              private fun detachTouchCaptureOverlay() {
                  recordOverlayView?.let {
                      windowManager.removeView(it)
                      recordOverlayView = null
                  }
              }

              private fun togglePlay() {
                  if (isRecording) return

                  if (recordedSteps.isEmpty()) {
                      tvStatus.text = "No recorded steps!"
                      return
                  }

                  if (!isPlaying) {
                      isPlaying = true
                      currentLoop = 0
                      btnPlay.text = "⏸ PAUSE"
                      btnPlay.setBackgroundColor(Color.parseColor("#C62828"))
                      startPlaybackLoop()
                  } else {
                      stopPlayback()
                  }
              }

              private fun stopPlayback() {
                  isPlaying = false
                  handler.removeCallbacksAndMessages(null)
                  btnPlay.text = "▶ PLAY"
                  btnPlay.setBackgroundColor(Color.parseColor("#1B5E20"))
                  tvStatus.text = "Stopped (${recordedSteps.size} steps)"
              }

              private fun startPlaybackLoop() {
                  if (!isPlaying) return

                  currentLoop++
                  if (maxLoops > 0 && currentLoop > maxLoops) {
                      stopPlayback()
