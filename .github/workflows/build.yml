name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Clean Android Project
        run: |
          # 1. Clean out any previous partial native builds
          rm -rf android
          
          # 2. Back up user's application code
          mkdir -p /tmp/user_backup
          cp -r lib /tmp/user_backup/
          cp pubspec.yaml /tmp/user_backup/
          
          # 3. Create fresh native scaffolding
          flutter create . --platforms=android --org=com.macro --project-name=macro_automator --overwrite
          
          # 4. Restore user's actual application code
          rm -rf lib pubspec.yaml
          cp -r /tmp/user_backup/lib ./
          cp /tmp/user_backup/pubspec.yaml ./

      - name: Configure Android Native Files
        run: |
          python3 - << 'EOF'
          import os

          # 1. Write clean, validated AndroidManifest.xml (No duplicate attributes)
          manifest_content = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="macro_automator"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:supportsPictureInPicture="true"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MacroAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice.AccessibilityService"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>'''

          with open("android/app/src/main/AndroidManifest.xml", "w", encoding="utf-8") as f:
              f.write(manifest_content.strip())

          # 2. Write accessibility configuration XML
          xml_content = '''<?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />'''

          os.makedirs("android/app/src/main/res/xml", exist_ok=True)
          with open("android/app/src/main/res/xml/accessibility_service_config.xml", "w", encoding="utf-8") as f:
              f.write(xml_content.strip())

          # 3. Write MainActivity.kt
          kotlin_dir = "android/app/src/main/kotlin/com/macro/macro_automator"
          os.makedirs(kotlin_dir, exist_ok=True)

          main_activity = '''package com.macro.macro_automator

          import android.app.PictureInPictureParams
          import android.content.Intent
          import android.os.Build
          import android.provider.Settings
          import android.util.Rational
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.macro.automator/actions"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "isAccessibilityEnabled" -> {
                              result.success(MacroAccessibilityService.instance != null)
                          }
                          "openAccessibilitySettings" -> {
                              startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                              result.success(true)
                          }
                          "enterPip" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  val params = PictureInPictureParams.Builder()
                                      .setAspectRatio(Rational(1, 1))
                                      .build()
                                  enterPictureInPictureMode(params)
                                  result.success(true)
                              } else {
                                  result.error("PIP_UNSUPPORTED", "Android O+ required for PiP", null)
                              }
                          }
                          "dispatchTap" -> {
                              val x = call.argument<Double>("x")?.toFloat() ?: 0f
                              val y = call.argument<Double>("y")?.toFloat() ?: 0f
                              MacroAccessibilityService.instance?.dispatchTap(x, y)
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }'''

          with open(os.path.join(kotlin_dir, "MainActivity.kt"), "w", encoding="utf-8") as f:
              f.write(main_activity.strip())

          # 4. Write MacroAccessibilityService.kt with API version guards
          service_code = '''package com.macro.macro_automator

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.os.Build
          import android.view.accessibility.AccessibilityEvent

          class MacroAccessibilityService : AccessibilityService() {
              companion object {
                  var instance: MacroAccessibilityService? = null
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun dispatchTap(x: Float, y: Float) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                      val path = Path().apply {
                          moveTo(x, y)
                      }
                      val gesture = GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(path, 0, 100))
                          .build()
                      dispatchGesture(gesture, null, null)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  instance = null
              }
          }'''

          with open(os.path.join(kotlin_dir, "MacroAccessibilityService.kt"), "w", encoding="utf-8") as f:
              f.write(service_code.strip())

          print("Android native code successfully prepared.")
          EOF

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
